name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg2://predicta:predicta@localhost:5432/predicta_ci
      SECRET_KEY: ci-only-secret-key
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: predicta
          POSTGRES_PASSWORD: predicta
          POSTGRES_DB: predicta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U predicta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app/
      - run: mypy
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade -1
      - run: alembic upgrade head
      - run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
