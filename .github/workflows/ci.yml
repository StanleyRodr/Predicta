name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg2://predicta:predicta@localhost:5432/predicta_ci
      SECRET_KEY: ci-only-secret-key-not-used-in-production
      # Unset would mean production, which demands SSL to the database and hides /docs.
      ENVIRONMENT: test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: predicta
          POSTGRES_PASSWORD: predicta
          POSTGRES_DB: predicta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U predicta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # PYSEC-2025-183 (CVE-2025-45768, PyJWT): disputed, no fixed release.
      # Mitigated by requiring a SECRET_KEY of 32+ characters in production
      # (task 041). Review on every audit (docs/seguridad/auditoria-039.md).
      - run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2025-183
      - run: ruff check app/
      - run: mypy
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade -1
      - run: alembic upgrade head
      - name: pytest (SQLite)
        run: pytest --cov=app --cov-report=term-missing
      - name: pytest (PostgreSQL)
        env:
          PGPASSWORD: predicta
          TEST_DATABASE_URL: postgresql+psycopg2://predicta:predicta@localhost:5432/predicta_test
        run: |
          createdb -h localhost -U predicta predicta_test
          pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Production dependencies only: dev tools never reach the build.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  # Playwright against the real API (uvicorn + PostgreSQL seeded with the thesis
  # dataset by backend/scripts/e2e_server.py) and the production build (task 053).
  e2e:
    runs-on: ubuntu-latest
    env:
      E2E_DATABASE_URL: postgresql+psycopg2://predicta:predicta@localhost:5432/predicta_e2e
      SECRET_KEY: ci-only-secret-key-not-used-in-production
      E2E_PYTHON: python
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: predicta
          POSTGRES_PASSWORD: predicta
          POSTGRES_DB: predicta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U predicta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${archive}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " ${archive}$" | sha256sum -c -
          tar -xzf "${archive}" gitleaks
      - name: Scan the full git history
        run: ./gitleaks git . --redact --no-banner --exit-code 1
