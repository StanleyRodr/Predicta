repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: ruff check --config backend/pyproject.toml backend/app
        language: python
        additional_dependencies: ["ruff==0.17.1"]
        files: ^backend/app/.*\.py$
        pass_filenames: false
